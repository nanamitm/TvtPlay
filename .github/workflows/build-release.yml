name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release x64 package
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TvtPlay
        run: >
          msbuild src\TvtPlay.sln /m /nologo
          /p:Configuration=Release /p:Platform=x64

      - name: Build BonDriver_Pipe
        run: >
          msbuild BonDriver_Pipe_src\BonDriver_Pipe.sln /m /nologo
          /p:Configuration=Release /p:Platform=x64

      - name: Create release archive
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $packageName = "TvtPlay-$tag-x64"
          $staging = Join-Path $env:RUNNER_TEMP $packageName
          $plugins = Join-Path $staging 'Plugins'
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\$packageName.zip"

          New-Item -ItemType Directory -Path $plugins -Force | Out-Null
          New-Item -ItemType Directory -Path (Split-Path -Parent $archive) -Force | Out-Null

          Copy-Item 'src\x64\Release\TvtPlay.tvtp' $plugins
          Copy-Item 'BonDriver_Pipe_src\x64\Release\BonDriver_Pipe.dll' $staging
          Copy-Item 'Readme.txt', 'TvtPlay_Readme.txt', 'TvtPlay_Blacklist.txt' $staging

          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $archive -Force
          (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() + "  " +
            (Split-Path -Leaf $archive) | Set-Content -LiteralPath "$archive.sha256" -NoNewline

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
